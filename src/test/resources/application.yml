spring:
  datasource:
    url: jdbc:h2:mem:hermes_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springdoc.webmvc.ui.SwaggerConfig

# Disable Springdoc/Swagger UI during tests to avoid classpath issues
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Prevent Springdoc auto-configuration classes from loading in tests

security:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    allowed-audiences:
  rate-limit:
    max-requests: 1000000
    window-seconds: 60

clerk:
  webhook:
    require-signature: false
    secret: test-secret
    max-timestamp-skew-seconds: 300
    replay-cache-ttl-seconds: 900

logging:
  level:
    root: WARN
