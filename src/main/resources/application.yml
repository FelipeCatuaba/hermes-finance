spring:
  application:
    name: hermes-finance
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: prd
  datasource:
    url: jdbc:postgresql://${SPRING_DATASOURCE_HOST}/${SPRING_DATASOURCE_DB}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ${DB_POOL_NAME}
      maximum-pool-size: ${DB_MAX_POOL_SIZE}
      minimum-idle: ${DB_MIN_IDLE}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS}
      max-lifetime: ${DB_MAX_LIFETIME_MS}
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: false
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true

  security:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS}
      refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS}
    rate-limit:
      max-requests: ${RATE_LIMIT_MAX_REQUESTS}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS}

  management:
    endpoints:
      web:
        exposure:
          include: health
    endpoint:
      health:
        show-details: never

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
      display-request-duration: true

  logging:
    level:
      root: ${LOG_LEVEL}

