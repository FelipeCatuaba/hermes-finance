services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_HOST: postgres
      SPRING_DATASOURCE_PORT: ${SPRING_DATASOURCE_PORT}
      SPRING_DATASOURCE_DB: ${SPRING_DATASOURCE_DB}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_ALLOWED_AUDIENCES: ${JWT_ALLOWED_AUDIENCES}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS}
      LOG_LEVEL: ${LOG_LEVEL}
      DB_POOL_NAME: ${DB_POOL_NAME}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE}
      DB_MIN_IDLE: ${DB_MIN_IDLE}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hermes-network

  postgres:
    image: postgres:15-alpine
    container_name: hermes-postgres-local
    environment:
      POSTGRES_DB: ${SPRING_DATASOURCE_DB}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hermes-network
    profiles:
      - local-only

volumes:
  postgres_data:

networks:
  hermes-network:
    driver: bridge
